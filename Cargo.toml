[package]
name = "as2026"
version = "0.7.5"
edition = "2024"
rust-version = "1.89"
default-run = "as2026"
description = "AS2026 — autosuunnistuksen kilpailunhallinta ja tuloslaskenta"
license = "BSD-2-Clause"
repository = "https://github.com/ppqalt/AS2026"
[dependencies]
# Linuxissa ei tarvita libudev-kehityspakettia. Toimii myös Windowsin COM-porteilla.
serialport = { version = "4.8", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
directories = { version = "6", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { version = "1", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Vanhan .xls/.xlsx-pohjan vain luku -tuonti, ei Excel-asennusta tai makroja.
calamine = { version = "=0.36.1", default-features = false }
quick-xml = "0.41"
snow = { version = "0.10", optional = true, default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
getrandom = { version = "0.3", optional = true }

libssh2-sys = { version = "=0.3.3", optional = true }
ssh2 = { version = "0.9", optional = true }

[features]
default = []
desktop = ["dep:libssh2-sys", "dep:ssh2", "dep:directories", "dep:reqwest", "dep:serde_json", "dep:semver", "dep:sha2", "dep:ed25519-dalek", "dep:tar", "dep:flate2", "dep:windows-sys", "dep:snow", "dep:getrandom"]
gui = ["desktop", "dep:slint", "dep:slint-build", "dep:rfd", "dep:image", "dep:ttf-parser"]

[dependencies.ttf-parser]
version = "0.25.1"
optional = true

[target.'cfg(windows)'.dependencies]
# Vain Windowsin omien rajapintojen Rust-sidokset; ei uutta ajonaikaista kirjastoa.
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[dependencies.slint]
version = "=1.18.1"
optional = true
default-features = false
features = ["std", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"]

[dependencies.rfd]
version = "0.15"
optional = true

[dependencies.image]
version = "0.25"
optional = true
default-features = false
features = ["png"]

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[[bin]]
name = "as2026"
path = "src/main.rs"

[[bin]]
name = "as2026-gui"
path = "src/bin/as2026-gui.rs"
required-features = ["gui"]

[[bin]]
name = "as2026-launcher"
path = "src/bin/as2026-launcher.rs"
required-features = ["desktop"]
