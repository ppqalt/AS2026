[package]
name = "as2015-rs"
version = "0.2.0"
edition = "2024"
description = "AS2015A:n staattiseen analyysiin perustuva suomenkielinen tulostyökalu"
[dependencies]
# Linuxissa ei tarvita libudev-kehityspakettia. Toimii myös Windowsin COM-porteilla.
serialport = { version = "4.8", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
