[package]
name = "as2026-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-2-Clause"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }

[dev-dependencies]
tempfile = "3"
