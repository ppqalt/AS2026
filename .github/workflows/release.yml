name: Julkaisupaketit ja manuaalinen GitHub-julkaisu

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tarkistettava vakaa main-haaran tagi, esimerkiksi v0.6.10'
        required: true
        type: string
      publish_release:
        description: 'Julkaise nimenomaisesti GitHub Release; oletuksena vain yksityiset Actions-paketit'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Tarkista ja kokoa (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Nouda julkaisutagi ja main-historia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Asenna Rustin julkaisutyökalu
        run: rustup toolchain install stable --profile minimal
      - name: Varmista AS2026:n täydellinen BSD-2-Clause-lisenssi ennen rakentamista
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- check-license
      - name: Varmista vakaa versio ja main-haaran julkaisu
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- verify --tag "$env:RELEASE_TAG"
        if: runner.os == 'Windows'
      - name: Varmista vakaa versio ja main-haaran julkaisu
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- verify --tag "$RELEASE_TAG"
        if: runner.os == 'Linux'
      - name: Asenna Linuxin käyttöliittymäkirjastojen kehitystiedostot
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev
      - name: Tarkista muotoilu
        run: cargo +stable fmt --all -- --check
      - name: Suorita kaikki testit
        run: cargo +stable test --locked --all-targets --features gui
      - name: Tarkista varoitukset
        run: cargo +stable clippy --locked --all-targets --features gui -- -D warnings
      - name: Testaa paketointi ja allekirjoituksen tarkistus
        run: cargo +stable test --manifest-path tools/release/Cargo.toml
      - name: Käännä GUI, käynnistin ja komentoriviohjelma
        run: cargo +stable build --locked --release --features gui
      - name: Kokoa tiedostot ja riippuvuuksien lisenssit
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- prepare --target ${{ matrix.target }} --output release-payloads/${{ matrix.target }}
      - name: Säilytä tarkistetut hyötytiedostot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: payload-${{ matrix.target }}
          path: release-payloads/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Nimenomaisesti pyydetty allekirjoitettu GitHub-julkaisu
    if: ${{ inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Nouda täsmälleen sama julkaisutagi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Asenna Rustin julkaisutyökalu
        run: rustup toolchain install stable --profile minimal
      - name: Varmista AS2026:n täydellinen BSD-2-Clause-lisenssi ennen allekirjoittamista
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- check-license
      - name: Varmista julkaisu uudelleen ennen salaisuuden käyttöä
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- verify --tag "$RELEASE_TAG"
      - name: Nouda Linux-paketti
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: payload-x86_64-unknown-linux-gnu
          path: release-payloads/x86_64-unknown-linux-gnu
      - name: Nouda Windows-paketti
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: payload-x86_64-pc-windows-msvc
          path: release-payloads/x86_64-pc-windows-msvc
      - name: Allekirjoita manifesti ja kokoa molemmat julkaisuarkistot
        env:
          AS2026_RELEASE_SIGNING_KEY: ${{ secrets.AS2026_RELEASE_SIGNING_KEY }}
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- sign --input release-payloads --output dist
      - name: Julkaise valmis vakaa versio
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "AS2026 ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
