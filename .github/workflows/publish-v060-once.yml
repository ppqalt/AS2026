name: Julkaise AS2026 0.6.0 kerran

# Julkaisutagi syntyy vasta saman main-commitin molempien CI-töiden läpäisystä.
on:
  workflow_run:
    workflows: ["Linux ja Windows"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  launch:
    name: Luo tarkistettu v0.6.0-tagi ja käynnistä allekirjoitettu julkaisu
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Nouda testattu main-historia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Varmista täsmälleen testattu julkaisucommit
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git log -1 --pretty=%s)" = 'Release AS2026 v0.6.0 [publish v0.6.0]'
          test "$(grep -m1 '^version = ' Cargo.toml)" = 'version = "0.6.0"'
          test "$(grep -m1 '^license = ' Cargo.toml)" = 'license = "BSD-2-Clause"'
          if git show-ref --verify --quiet refs/tags/v0.6.0; then
            echo 'v0.6.0 on jo olemassa, julkaisua ei toisteta.' >&2
            exit 1
          fi
      - name: Luo tagi ja käynnistä allekirjoitettu julkaisu
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v0.6.0' -f sha="$TESTED_SHA" >/dev/null
          gh workflow run release.yml -R "$GH_REPO" --ref main -f release_tag=v0.6.0 -F publish_release=true
