name: Linux ja Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Alustakohtaiset tarkistukset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Nouda lähdekoodi
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Asenna Rustin tarkistustyökalut
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Varmista AS2026:n täydellinen BSD-2-Clause-lisenssi ennen rakentamista
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- check-license
      - name: Testaa julkaisupaketointi ja allekirjoitus
        run: cargo +stable test --manifest-path tools/release/Cargo.toml
      - name: Asenna Linuxin käyttöliittymäkirjastojen kehitystiedostot
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev xvfb
      - name: Tarkista muotoilu
        run: cargo +stable fmt --all -- --check
      - name: Tarkista kääntyminen
        run: cargo +stable check --all-targets
      - name: Suorita testit
        run: cargo +stable test --all-targets --no-fail-fast
      - name: Tarkista varoitukset
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Käännä alustakohtainen julkaisuversio
        run: cargo +stable build --release
      - name: Suorita ohjelman sisäinen esimerkki
        run: cargo +stable run --release --bin as2026 -- esimerkki
      - name: Tarkista myös graafinen käyttöliittymä
        run: cargo +stable check --all-targets --features gui
      - name: Suorita käyttöliittymän ja yhteisen sovelluslogiikan testit
        env:
          AS2026_PRINT_PREVIEW_DIR: target/print-preview
        run: cargo +stable test --all-targets --features gui --no-fail-fast
      - name: Säilytä tulostuksen tarkistuskuvat
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: print-preview-${{ github.sha }}
          path: target/print-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tarkista myös käyttöliittymän varoitukset
        run: cargo +stable clippy --all-targets --features gui -- -D warnings
      - name: Käännä GUI-työnkulkukoe
        run: cargo +stable build --locked --features gui --bin as2026-gui
      - name: Kokeile GUI:n työnkulut ja näppäimistö 100 ja 150 prosentin skaalauksella
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          SLINT_SCALE_FACTOR=1 xvfb-run -a target/debug/as2026-gui --demo --smoke-test --capture-dir target/gui-smoke/100
          SLINT_SCALE_FACTOR=1.5 xvfb-run -a target/debug/as2026-gui --demo --smoke-test --capture-dir target/gui-smoke/150
          AS2026_EMIT_CORRECTION_TEST=1 SLINT_SCALE_FACTOR=1 xvfb-run -a target/debug/as2026-gui --demo --capture-dir target/gui-smoke/emit-069
          AS2026_MENU_GUI_TEST=1 SLINT_SCALE_FACTOR=1 xvfb-run -a --server-args='-screen 0 2560x1440x24' target/debug/as2026-gui --demo --capture-dir target/gui-smoke/valikot
      - name: Säilytä GUI:n tarkistuskuvat
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gui-smoke-${{ github.sha }}
          path: target/gui-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Kokeile Windows-GUI:n työnkulut ja näppäimistö 100 ja 150 prosentin skaalauksella
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          SLINT_BACKEND: winit-software
        run: |
          $app = (Resolve-Path target/debug/as2026-gui.exe).Path
          foreach ($scale in @('1', '1.5')) {
            $env:SLINT_SCALE_FACTOR = $scale
            $folder = if ($scale -eq '1') { '100' } else { '150' }
            $start = [System.Diagnostics.ProcessStartInfo]::new($app)
            $start.UseShellExecute = $false
            foreach ($argument in @('--demo', '--smoke-test', '--capture-dir', "target/gui-smoke/$folder")) {
              $start.ArgumentList.Add($argument)
            }
            $test = [System.Diagnostics.Process]::Start($start)
            try {
              $test.WaitForExit()
              if ($test.ExitCode -ne 0) { throw "Windows-GUI-koe epäonnistui $folder % skaalauksella: $($test.ExitCode)" }
            } finally { $test.Dispose() }
          }
          $env:AS2026_EMIT_CORRECTION_TEST = '1'
          $env:SLINT_SCALE_FACTOR = '1'
          $test = Start-Process -FilePath $app -ArgumentList @('--demo', '--capture-dir', 'target/gui-smoke/emit-069') -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Emit-editorin GUI-koe epäonnistui: $($test.ExitCode)" }
          Remove-Item Env:AS2026_EMIT_CORRECTION_TEST
          $env:AS2026_MENU_GUI_TEST = '1'
          $start = [System.Diagnostics.ProcessStartInfo]::new($app)
          $start.UseShellExecute = $false
          foreach ($argument in @('--demo', '--capture-dir', 'target/gui-smoke/valikot')) { $start.ArgumentList.Add($argument) }
          $test = [System.Diagnostics.Process]::Start($start)
          try {
            $test.WaitForExit()
            if ($test.ExitCode -ne 0) { throw "Windowsin valikkokoe epäonnistui: $($test.ExitCode)" }
          } finally { $test.Dispose() }
      - name: Säilytä Windows-GUI:n tarkistuskuvat
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gui-smoke-windows-${{ github.sha }}
          path: target/gui-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Käännä GUI, käynnistin ja komentoriviohjelma
        run: cargo +stable build --locked --release --features gui
      - name: Kokoa yksityinen BSD-2-Clause-paketti Linuxille
        if: runner.os == 'Linux'
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- prepare --target x86_64-unknown-linux-gnu --output target/ci-release-payload
      - name: Kokoa yksityinen BSD-2-Clause-paketti Windowsille
        if: runner.os == 'Windows'
        run: cargo +stable run --manifest-path tools/release/Cargo.toml -- prepare --target x86_64-pc-windows-msvc --output target/ci-release-payload
      - name: Säilytä tarkistettu yksityinen paketti Actions-artifactina
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: as2026-private-${{ runner.os }}-${{ github.sha }}
          path: target/ci-release-payload/
          if-no-files-found: error
          retention-days: 7
