name: Julkaise AS2026 0.5.5 kerran
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v055-once.yml

permissions:
  contents: read

jobs:
  launch:
    name: Luo julkaisutagi ja käynnistä allekirjoitettu julkaisu
    if: ${{ github.event.head_commit.message == 'Release AS2026 v0.5.5 [publish v0.5.5]' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Nouda nimenomainen julkaisucommit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Varmista julkaistava versio ja historia
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(grep -m1 '^version = ' Cargo.toml)" = 'version = "0.5.5"'
          test "$(grep -m1 '^license = ' Cargo.toml)" = 'license = "BSD-2-Clause"'
          if git show-ref --verify --quiet refs/tags/v0.5.5; then
            echo 'v0.5.5 on jo olemassa; tätä automatisointia ei ajeta uudelleen.' >&2
            exit 1
          fi
      - name: Luo v0.5.5-tagi ja käynnistä varsinainen julkaisuajo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v0.5.5' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run release.yml -R "$GH_REPO" --ref main -f release_tag=v0.5.5 -F publish_release=true
